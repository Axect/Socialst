# User overrides sourced by makepkg after /etc/makepkg.conf (+ .d/*.conf).
# Only makepkg (yay/AUR builds) reads this; pacman repo downloads are unaffected.
# http/https go through makepkg-fastdl (parallel byte ranges for large files);
# other protocols are the stock /etc/makepkg.conf entries.
DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/home/axect/.local/bin/makepkg-fastdl %u %o'
          'https::/home/axect/.local/bin/makepkg-fastdl %u %o'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
